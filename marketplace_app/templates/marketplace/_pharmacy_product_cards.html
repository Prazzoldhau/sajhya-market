{% load marketplace_extras %}
{% for product in products %}
<a href="{% url 'pharmacy-product-detail' product.id %}" class="store-card">
    <div class="store-card-img">
        {% if product.requires_prescription %}<span class="store-rx-badge">Rx</span>{% endif %}
        {% if product.image_url_path %}
            <img src="{{ product.image_url_path }}" alt="{{ product.name }}" loading="lazy" decoding="async">
        {% else %}
            <span class="placeholder">💊</span>
        {% endif %}
    </div>
    <div class="store-card-body">
        <p class="store-card-name">{{ product.name }}</p>
        <div class="store-card-price">NPR {{ product.price }}</div>
    </div>
</a>
{% endfor %}

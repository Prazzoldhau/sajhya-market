{% load marketplace_extras %}
<header class="store-header">
    <div class="store-wrap store-header-row">
        <a href="{% url 'landing' %}" class="store-logo">
            <img src="{{ 'img/logo.png'|plain_static }}" alt="Sajhya">
            Sajhya
        </a>

        <nav class="store-nav">
            <a href="{% url 'vacancy-list' %}" class="is-active">Careers</a>
            <a href="{% url 'marketplace' %}">Marketplace</a>
            <a href="{% url 'pharmacy' %}">Pharmacy</a>
        </nav>

        <form class="store-search" method="GET" action="{% url 'vacancy-list' %}">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                <path d="M21 21l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="text" name="search" value="{{ search }}" placeholder="Search open roles...">
        </form>

        <div class="store-header-icons">
            <a href="{% url 'login' %}" class="store-icon-btn" title="Account">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M4.5 20c1.4-3.4 4.4-5.2 7.5-5.2s6.1 1.8 7.5 5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </a>
        </div>
    </div>
</header>
